[project]
name = "automind-x"
version = "1.2.0"
description = "Self-adaptive, explainable, multi-objective neural architecture search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.5", "mypy>=1.8", "bandit>=1.7", "interrogate>=1.7", "pre-commit>=3.5"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF100"]
ignore = ["C408"]  # dict(key=value) is used deliberately for readable records

[tool.ruff.lint.per-file-ignores]
"automind/visualize.py" = ["E402"]   # matplotlib.use("Agg") must run before pyplot is imported

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["automind"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.interrogate]
fail-under = 95
ignore-init-method = true
ignore-magic = true
verbose = 1
paths = ["automind", "main.py", "benchmarks", "examples"]

[tool.bandit]
exclude_dirs = ["tests"]
