name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy automind main.py
      - run: bandit -q -r automind main.py -c pyproject.toml
      - run: interrogate -q automind main.py benchmarks examples
      - run: pip-audit -r requirements.txt
      - run: python -m pytest --cov=automind
      - run: python main.py --quick --outdir /tmp/out --json --quiet
      - run: python main.py --quick --outdir /tmp/out2 --no-plots --quiet --compare-random 2
      - run: python examples/quickstart.py > /dev/null
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
